                  <a href={personalInfo.github} target="_blank" className="w-full sm:w-auto px-7 py-3.5 sm:py-4 rounded-xl sm:rounded-2xl bg-slate-900 text-white font-bold text-sm border border-slate-700 hover:bg-slate-950">
                    GitHub Profile
                  </a>
                  <a href={personalInfo.medium} target="_blank" className="w-full sm:w-auto px-7 py-3.5 sm:py-4 rounded-xl sm:rounded-2xl bg-emerald-600 text-white font-bold text-sm shadow-lg hover:bg-emerald-500">
                    Medium Profile
                  </a>
                  <button onClick={handleCopyEmail} className="w-full sm:w-auto px-7 py-3.5 sm:py-4 rounded-xl sm:rounded-2xl bg-slate-900 border border-slate-700 text-cyan-300 font-bold text-sm hover:border-cyan-400">
                    {copied ? 'Email Copied!' : personalInfo.email}
                  </button>
                </div>
              </div>

              <div className="pt-6 sm:pt-8 flex justify-center text-xs sm:text-sm font-bold text-slate-400">
                <a href="#home" className="hover:text-cyan-400 transition-colors">Back to top ↑</a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
